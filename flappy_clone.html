<!DOCTYPE html>
<!-- flappy_clone.html: deterministic, instrumented Flappy Bird for agent benchmarking.
     Same seeded pipe sequence for every agent/episode. Humans: Space/click to flap, R to restart.
     Agents: window.flappy.reset(), .step(n), .flap(), .getState() -> {bird_y, vy, gap_y, gap_dist, score, alive} -->
<html>
<head><meta charset="utf-8"><title>Flappy Bird — Agent Benchmark</title>
<style>
  body { margin:0; background:#222; display:flex; flex-direction:column; align-items:center;
         font-family:monospace; color:#eee; }
  canvas { margin-top:8px; border:2px solid #555; }
  #hud { margin:6px; font-size:14px; }
</style></head>
<body>
<div id="hud">Agents drive via window.flappy — humans: SPACE / click = flap, R = restart</div>
<canvas id="c" width="480" height="640"></canvas>
<script>
(() => {
  const W = 480, H = 640, GROUND_Y = 610, BIRD_X = 100, BIRD_R = 14;
  const GRAVITY = 0.32, FLAP_VY = -6.0, PIPE_SPEED = 2.3, GAP = 155, PIPE_W = 52, SPAWN_EVERY = 95;

  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let st = null;

  function reset(seed = 1234) {
    const rand = mulberry32(seed);
    const gapCenters = [];
    for (let i = 0; i < 200; i++) gapCenters.push(140 + Math.floor(rand() * 360));
    st = {
      seed, gapCenters, pipeCount: 0, nextSpawn: 60,
      pipes: [], birdY: 280, vy: 0, score: 0, alive: true, frames: 0, deaths: ''
    };
  }

  function flap() { if (st && st.alive) st.vy = FLAP_VY; }

  function step(n = 1) {
    if (!st) reset();
    for (let i = 0; i < n && st.alive; i++) {
      st.frames++;
      st.vy += GRAVITY;
      st.birdY += st.vy;

      // spawn pipes on the fixed seeded schedule
      if (st.frames >= st.nextSpawn) {
        st.pipes.push({ x: W + PIPE_W, gapY: st.gapCenters[st.pipeCount], passed: false });
        st.pipeCount++;
        st.nextSpawn += SPAWN_EVERY;
      }
      for (const p of st.pipes) p.x -= PIPE_SPEED;
      st.pipes = st.pipes.filter(p => p.x + PIPE_W > -10);

      // scoring
      for (const p of st.pipes) {
        if (!p.passed && p.x + PIPE_W < BIRD_X - BIRD_R) { p.passed = true; st.score++; }
      }

      // collisions
      if (st.birdY + BIRD_R >= GROUND_Y) { st.alive = false; st.deaths = 'ground'; }
      if (st.birdY - BIRD_R <= 0) { st.birdY = BIRD_R; st.vy = 0; }
      for (const p of st.pipes) {
        if (BIRD_X + BIRD_R > p.x && BIRD_X - BIRD_R < p.x + PIPE_W) {
          if (st.birdY - BIRD_R < p.gapY - GAP / 2 || st.birdY + BIRD_R > p.gapY + GAP / 2) {
            st.alive = false; st.deaths = 'pipe';
          }
        }
      }
    }
    render();
  }

  function getState() {
    if (!st) reset();
    let next = null;
    for (const p of st.pipes) {
      if (p.x + PIPE_W > BIRD_X - BIRD_R) { next = p; break; }
    }
    return {
      bird_y: Math.round(st.birdY),
      vy: Math.round(st.vy * 100) / 100,
      gap_y: next ? next.gapY : null,
      gap_dist: next ? Math.round(next.x - (BIRD_X - BIRD_R)) : null,
      score: st.score, alive: st.alive, frames: st.frames, cause: st.deaths
    };
  }

  function render() {
    const s = getState();
    ctx.fillStyle = '#70c5ce'; ctx.fillRect(0, 0, W, H);
    for (const p of st.pipes) {
      ctx.fillStyle = '#5ec95e';
      ctx.fillRect(p.x, 0, PIPE_W, p.gapY - GAP / 2);
      ctx.fillRect(p.x, p.gapY + GAP / 2, PIPE_W, GROUND_Y - (p.gapY + GAP / 2));
    }
    ctx.fillStyle = '#ded895'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.fillStyle = '#f7d51d'; ctx.beginPath();
    ctx.arc(BIRD_X, st.birdY, BIRD_R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px monospace'; ctx.fillText(String(st.score), W / 2 - 8, 50);
    if (!st.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 240, W, 130);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px monospace';
      ctx.fillText('DEAD  score=' + st.score, W / 2 - 100, 300);
      ctx.font = '14px monospace';
      ctx.fillText('R or window.flappy.reset() to restart', W / 2 - 130, 330);
    }
  }

  window.flappy = { reset, step, flap, getState, render };
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { flap(); e.preventDefault(); }
    if (e.code === 'KeyR') reset();
  });
  canvas.addEventListener('mousedown', () => flap());

  reset(); render();
})();
</script>
</body>
</html>
