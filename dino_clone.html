<!DOCTYPE html>
<!-- dino_clone.html: deterministic Chrome Dino for agent benchmarking.
     Same obstacle sequence for every agent/episode. Human controls: Arrow up = jump, Space = jump, R to reset.
     Agents: window.dino.reset(), .step(n), .jump(), .getState() -> {dino_y, ground_y, next_obstacle_x, obstacle_y, obstacle_width, obstacle_gap, score, alive}
-->
<html>
<head><meta charset="utf-8"><title>Dino — Agent Benchmark</title>
<style>
  body { margin:0; background:#222; display:flex; flex-direction:column; align-items:center;
         font-family:monospace; color:#eee; }
  canvas { margin-top:8px; border:2px solid #555; }
  #hud { margin:6px; font-size:14px; }
</style></head>
<body>
<div id="hud">Agents drive via window.dino — humans: ARROW_UP / SPACE = jump, R = reset</div>
<canvas id="c" width="480" height="200"></canvas>
<script>
(() => {
  const W = 480, H = 200, DINO_X = 80, DINO_WIDTH = 40, DINO_HEIGHT = 32, GROUND_Y = H - 16;
  const GRAVITY = 0.35, JUMP_VEL = -11.0, OBSTACLE_SPEED = 5.6, GAP = 70, PIPE_WIDTH = 44, SPAWN_EVERY = 75;

  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let st = null;

  function reset(seed = 5678) {
    const rand = mulberry32(seed);
    const obstacles = [];
    for (let i = 0; i < 200; i++) obstacles.push({ x: W + PIPE_WIDTH, y: 80 + Math.floor(rand() * (H - 80 - GAP)) });
    st = { seed, obstacles, obstacleCount: 0, nextSpawn: SPAWN_EVERY,
           dinoY: GROUND_Y, vy: 0, score: 0, alive: true, frames: 0, deaths: '' };
  }

  function jump() { if (st && st.alive) st.vy = JUMP_VEL; }

  function step(n = 1) {
    if (!st) reset();
    for (let i = 0; i < n && st.alive; i++) {
      st.frames++;
      st.vy += GRAVITY;
      st.dinoY += st.vy;

      // spawn obstacles on fixed schedule
      if (st.frames >= st.nextSpawn) {
        st.obstacles.push({ x: W + PIPE_WIDTH, y: st.obstacles[st.obstacleCount]?.y ?? (H - 80) });
        st.obstacleCount++;
        st.nextSpawn += SPAWN_EVERY;
      }
      for (const o of st.obstacles) o.x -= OBSTACLE_SPEED;
      st.obstacles = st.obstacles.filter(o => o.x + PIPE_WIDTH > -20);

      // scoring (pass through lower obstacle)
      for (const o of st.obstacles) {
        if (!o.passed && o.x + PIPE_WIDTH < DINO_X - DINO_WIDTH) { o.passed = true; st.score++; }
      }

      // collisions
      if (st.dinoY + DINO_HEIGHT > GROUND_Y) { st.alive = false; st.deaths = 'ground'; }
      if (st.dinoY < 0) { st.dinoY = 0; st.vy = 0; }
      for (const o of st.obstacles) {
        if (DINO_X < o.x + PIPE_WIDTH && DINO_X + DINO_WIDTH > o.x) {
          const top = o.y, bottom = H - GAP - o.y;
          if (st.dinoY + DINO_HEIGHT < top || st.dinoY > H - bottom) {
            st.alive = false; st.deaths = 'pipe';
          }
        }
      }
    }
    render();
  }

  function getState() {
    if (!st) reset();
    const next = st.obstacles.find(o => o.x + PIPE_WIDTH > DINO_X);
    return {
      dino_y: Math.round(st.dinoY),
      vy: Math.round(st.vy * 100) / 100,
      obstacle_x: next ? next.x : null,
      obstacle_y: next ? next.y : null,
      obstacle_gap: GAP,
      obstacle_width: PIPE_WIDTH,
      score: st.score, alive: st.alive, frames: st.frames, cause: st.deaths
    };
  }

  function render() {
    ctx.fillStyle = '#555'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#333'; ctx.fillRect(0, H - 20, W, 20);
    // ground line
    ctx.strokeStyle = '#777'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
    // obstacle
    for (const o of st.obstacles) {
      ctx.fillStyle = '#5ec95e';
      ctx.fillRect(o.x, 0, PIPE_WIDTH, o.y);
      ctx.fillRect(o.x, o.y + GAP, PIPE_WIDTH, H - o.y - GAP);
    }
    // dino
    ctx.fillStyle = '#f7d51d'; ctx.fillRect(DINO_X, st.dinoY, DINO_WIDTH, DINO_HEIGHT);
    // hud
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px monospace'; ctx.fillText(`score=${st.score} cause=${st.deaths}`, 10, H - 10);
    if (!st.alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, H/2 - 50, W, 100);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px monospace';
      ctx.fillText('DEAD', W/2 - 30, H/2);
      ctx.font = '14px monospace';
      ctx.fillText('R or window.dino.reset() to restart', W/2 - 120, H/2 + 30);
    }
  }

  window.dino = { reset, step, jump, getState, render };

  // human controls
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowUp' || e.code === 'Space') { jump(); e.preventDefault(); }
    if (e.code === 'KeyR') reset();
  });
  canvas.addEventListener('click', () => jump());

  reset(); render();
})();
</script>
</body>
</html>
